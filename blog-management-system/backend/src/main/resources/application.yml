server:
  port: 8081

spring:
  application:
    name: blog-management-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blogdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:kitcoek}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    # MUST be overridden in production (>= 32 characters).
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@blog.local}
    password: ${ADMIN_PASSWORD:Admin@12345}
  seed-demo-data: ${SEED_DEMO_DATA:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
